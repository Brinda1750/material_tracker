name: material_tracker
description: Material Tracking & Costing Application

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.15.1
  firebase_auth: ^4.9.0
  cloud_firestore: ^4.9.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  fl_chart: ^0.63.0
  
  # Utils
  get_it: ^7.6.0
  intl: ^0.18.1
  connectivity_plus: ^4.0.2
  
  # QR Code
  qr_code_scanner: ^1.0.1
  
  # Export
  pdf: ^3.10.4
  path_provider: ^2.1.1
  csv: ^5.0.2
  share_plus: ^7.1.0
  
  # State Management
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
